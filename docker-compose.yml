services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: police
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: police_objects
    ports:
      - "5432:5432"
    volumes:
      - police_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U police -d police_objects"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  police_pgdata:
